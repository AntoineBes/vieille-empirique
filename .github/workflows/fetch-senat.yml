name: Fetch — Sénat

on:
  schedule:
    - cron: "15 7 * * *"  # Tous les jours à 07h15 UTC
  workflow_dispatch:

jobs:
  fetch:
    name: Sync Sénat
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Run Sénat connector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx src/scripts/run-connector.ts senat
